<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>新年 AR 自拍相框</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      #stage-container {
        position: relative;
        width: 100vw;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* 鏡頭畫面：透過 class 動態控制鏡像反轉 */
      #camera-video {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      .mirror {
        transform: scaleX(-1);
      }

      /* 相框層：contain 確保整幅相框 100% 完整露出不裁切 */
      #frame-overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: url('./newyear.png');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: contain;
        pointer-events: none;
        z-index: 2;
      }

      /* 控制介面 */
      .ui-bar {
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom));
        left: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        z-index: 10;
      }

      .btn-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      /* 拍照按鈕 */
      #shutter-btn {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #e60012;
        border: 4px solid #fff;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        outline: none;
        transition: transform 0.1s;
      }
      #shutter-btn:active {
        transform: scale(0.92);
      }

      /* 切換鏡頭按鈕 */
      #switch-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 2px solid rgba(255, 255, 255, 0.8);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
      }
      #switch-btn:active {
        transform: scale(0.9);
      }
      #switch-btn svg {
        width: 24px;
        height: 24px;
        fill: #fff;
      }

      .hint {
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 16px;
        border-radius: 20px;
        border: 1px solid rgba(255, 215, 0, 0.8);
      }

      #render-canvas {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage-container">
      <video id="camera-video" class="mirror" autoplay playsinline muted></video>
      <div id="frame-overlay"></div>
    </div>

    <div class="ui-bar">
      <div class="hint">🧧 對準相框，按下按鈕合照存檔 🧧</div>
      <div class="btn-row">
        <!-- 佔位用，保持快門鍵居中 -->
        <div style="width: 48px;"></div>

        <!-- 拍照按鈕 -->
        <button id="shutter-btn" onclick="capturePhoto()" aria-label="拍照"></button>

        <!-- 切換鏡頭按鈕 -->
        <button id="switch-btn" onclick="toggleCamera()" aria-label="切換鏡頭">
          <svg viewBox="0 0 24 24">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
        </button>
      </div>
    </div>

    <canvas id="render-canvas"></canvas>

    <script>
      const video = document.getElementById('camera-video');
      const canvas = document.getElementById('render-canvas');
      const frameImg = new Image();
      frameImg.src = './newyear.png';

      // 紀錄目前使用的鏡頭：'user' (前置自拍) 或 'environment' (後置鏡頭)
      let currentFacingMode = 'user';
      let currentStream = null;

      async function initCamera(facingMode) {
        // 停止之前的鏡頭串流以釋放硬件資源
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        try {
          const constraints = {
            audio: false,
            video: {
              facingMode: { ideal: facingMode },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          };

          currentStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = currentStream;

          // 自拍鏡頭開啟鏡像，後置鏡頭關閉鏡像
          if (facingMode === 'user') {
            video.classList.add('mirror');
          } else {
            video.classList.remove('mirror');
          }
          currentFacingMode = facingMode;
        } catch (err) {
          alert('無法取得相機權限，請確認瀏覽器設定。');
          console.error(err);
        }
      }

      // 切換前後鏡頭
      function toggleCamera() {
        const targetMode = currentFacingMode === 'user' ? 'environment' : 'user';
        initCamera(targetMode);
      }

      // 拍照並精確合成照片
      function capturePhoto() {
        if (!video.videoWidth || !frameImg.complete) return;

        const targetWidth = frameImg.naturalWidth || 1080;
        const targetHeight = frameImg.naturalHeight || 1920;

        canvas.width = targetWidth;
        canvas.height = targetHeight;
        const ctx = canvas.getContext('2d');

        // 計算裁切比例使其填滿畫面背後
        const vWidth = video.videoWidth;
        const vHeight = video.videoHeight;
        const videoRatio = vWidth / vHeight;
        const frameRatio = targetWidth / targetHeight;

        let sWidth, sHeight, sx, sy;
        if (videoRatio > frameRatio) {
          sHeight = vHeight;
          sWidth = vHeight * frameRatio;
          sx = (vWidth - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = vWidth;
          sHeight = vWidth / frameRatio;
          sx = 0;
          sy = (vHeight - sHeight) / 2;
        }

        // 判斷是否需要鏡像繪製
        ctx.save();
        if (currentFacingMode === 'user') {
          ctx.translate(targetWidth, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, targetWidth, targetHeight);
        ctx.restore();

        // 疊加相框層
        ctx.drawImage(frameImg, 0, 0, targetWidth, targetHeight);

        // 下載合成相片
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const downloadLink = document.createElement('a');
